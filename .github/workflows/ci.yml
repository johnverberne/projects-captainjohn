name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, API & E2E (film)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      NODE_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/project-captainjohn-ci
      MONGO_SESSION_URI: mongodb://127.0.0.1:27017/project-captainjohn-ci
      SESSION_SECRET: ci-session-secret
      ADMIN_EMAIL: admin@example.com
      COOKIE_SECURE: "false"
      PORT: "5055"
      E2E_EMAIL: e2e@example.com
      E2E_PASSWORD: e2e-pass-123

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm --prefix ./client ci

      - name: Build client
        run: npm run build

      - name: Unit + API tests
        run: npm run test:node

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E film
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test film & results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-film-and-results
          path: |
            test-results/
          retention-days: 14
          if-no-files-found: ignore
